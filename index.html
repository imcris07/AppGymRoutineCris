<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Rutina de Entrenamiento - Cris y Fafis</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        :root {
            --color1: #EAF2F8;
            --color2: #C9DCE8;
            --color3: #8AA9C4;
            --color4: #3E5C76;
            --color5: #1D2D44;
            --success: #28a745;
            --warning: #ffc107;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: var(--color1);
            color: var(--color5);
            line-height: 1.6;
            font-size: 16px;
        }
        
        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 12px;
        }
        
        /* ===== MODAL CONTRASEÑA ===== */
        .password-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(29, 45, 68, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        
        .password-modal.hidden {
            display: none;
        }
        
        .password-box {
            background: white;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 300px;
        }
        
        .password-box h2 {
            color: var(--color5);
            margin-bottom: 8px;
            font-size: 20px;
        }
        
        .password-box p {
            color: var(--color3);
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .password-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 2px solid var(--color2);
            border-radius: 8px;
            font-size: 16px;
            color: var(--color5);
        }
        
        .password-box input:focus {
            outline: none;
            border-color: var(--color4);
            box-shadow: 0 0 0 3px rgba(62, 92, 118, 0.1);
        }
        
        .password-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--color4) 0%, var(--color5) 100%);
            color: var(--color1);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .password-box button:active {
            transform: scale(0.98);
        }
        
        .password-error {
            color: #dc3545;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }
        
        .password-error.show {
            display: block;
        }
        
        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, var(--color4) 0%, var(--color5) 100%);
            color: var(--color1);
            padding: 20px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(29, 45, 68, 0.15);
        }
        
        .header h1 {
            font-size: clamp(20px, 6vw, 28px);
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .header p {
            font-size: clamp(12px, 3.5vw, 14px);
            opacity: 0.95;
            margin-bottom: 12px;
        }
        
        .header-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .header-badge {
            display: inline-block;
            background: rgba(201, 220, 232, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }
        
        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .search-box {
            width: 100%;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--color2);
            border-radius: 8px;
            font-size: 16px;
            color: var(--color5);
            background-color: white;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: var(--color4);
            box-shadow: 0 0 0 3px rgba(62, 92, 118, 0.1);
        }
        
        .btn-help {
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--color4) 0%, var(--color5) 100%);
            color: var(--color1);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-help:active {
            transform: scale(0.98);
        }
        
        @media (min-width: 480px) {
            .toolbar {
                flex-direction: row;
            }
            
            .search-box {
                flex: 1;
            }
            
            .btn-help {
                width: auto;
            }
        }
        
        
        /* ===== PERFILES ===== */
        .perfiles { display: flex; gap: 8px; margin-bottom: 16px; }
        .perfil-btn {
            flex: 1; padding: 14px 10px; border: 2px solid var(--color2); background: white;
            color: var(--color4); border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .perfil-btn.active {
            background: linear-gradient(135deg, var(--color4) 0%, var(--color5) 100%);
            color: var(--color1); border-color: var(--color5);
        }
        .perfil-btn:active { transform: scale(0.98); }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--color2);
            padding-bottom: 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        .tab-btn {
            padding: 12px 14px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--color3);
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        
        .tab-btn.active {
            color: var(--color5);
            border-bottom-color: var(--color4);
        }
        
        @media (min-width: 600px) {
            .tabs {
                gap: 8px;
            }
            
            .tab-btn {
                padding: 12px 16px;
                font-size: 14px;
            }
        }
        
        /* ===== DÍA HEADER ===== */
        .dia-header {
            background: white;
            border-left: 4px solid var(--color4);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .dia-header h2 {
            font-size: clamp(16px, 5vw, 20px);
            color: var(--color4);
            margin-bottom: 4px;
        }
        
        .dia-header p {
            font-size: 13px;
            color: var(--color3);
        }
        
        /* ===== EJERCICIO CARD ===== */
        .ejercicio-card {
            background: white;
            border: 1px solid var(--color2);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }
        
        .ejercicio-card:active {
            border-color: var(--color4);
        }
        
        .ejercicio-card.expanded {
            border-color: var(--color4);
            box-shadow: 0 4px 12px rgba(62, 92, 118, 0.15);
        }
        
        .ejercicio-header {
            padding: 14px 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .ejercicio-header:active {
            background: var(--color1);
        }
        
        .ejercicio-info h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--color5);
            margin-bottom: 6px;
            line-height: 1.3;
        }
        
        .ejercicio-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .tag {
            font-size: 11px;
            background: var(--color1);
            color: var(--color4);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--color2);
        }
        
        .tag.tipo {
            background: rgba(62, 92, 118, 0.1);
            color: var(--color4);
            border: none;
            font-weight: 600;
        }
        
        .ejercicio-toggle {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color1);
            border-radius: 6px;
            color: var(--color4);
            font-weight: 700;
            font-size: 20px;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        
        .ejercicio-card.expanded .ejercicio-toggle {
            background: var(--color4);
            color: white;
        }
        
        .ejercicio-content {
            display: none;
            border-top: 1px solid var(--color2);
            padding: 16px 12px;
            background: var(--color1);
        }
        
        .ejercicio-card.expanded .ejercicio-content {
            display: block;
        }
        
        /* ===== SMARTWORKOUT SECTION ===== */
        .smartworkout-section {
            background: rgba(62, 92, 118, 0.05);
            border: 2px solid var(--color4);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 14px;
            text-align: center;
        }
        
        .smartworkout-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .smartworkout-section h4 {
            color: var(--color5);
            font-size: 13px;
            margin-bottom: 6px;
            font-weight: 700;
        }
        
        .smartworkout-section p {
            font-size: 12px;
            color: var(--color3);
            margin-bottom: 10px;
        }
        
        .btn-smartworkout {
            display: inline-block;
            background: linear-gradient(135deg, var(--color4) 0%, var(--color5) 100%);
            color: var(--color1);
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn-smartworkout:active {
            transform: scale(0.95);
        }
        
        
        .media-item { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--color2); }
        .media-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .media-title { font-size: 13px; font-weight: 700; color: var(--color5); margin-bottom: 8px; text-align: left; }
        .media-aprox { font-size: 10px; background: var(--color2); color: var(--color5); padding: 2px 8px; border-radius: 10px; font-weight: 600; vertical-align: middle; }
        .media-video { width: 100%; max-height: 320px; border-radius: 8px; background: var(--color5); display: block; margin-bottom: 8px; }
        .media-thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .media-thumbs img { width: 100%; height: auto; border-radius: 6px; background: var(--color2); aspect-ratio: 1 / 1; object-fit: cover; }

        /* ===== DETALLES ===== */
        .ejercicio-detalles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 14px;
        }
        
        .detalle {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid var(--color4);
        }
        
        .detalle-label {
            font-size: 11px;
            color: var(--color3);
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 700;
        }
        
        .detalle-valor {
            font-size: 16px;
            font-weight: 700;
            color: var(--color4);
        }
        
        @media (min-width: 600px) {
            .ejercicio-header {
                padding: 14px 16px;
            }
            
            .ejercicio-content {
                padding: 16px;
            }
        }
        
        /* ===== PROGRESO ===== */
        .progreso-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--color2);
        }
        
        .progreso-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--color3);
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .progreso-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--color2);
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--color5);
            background: white;
        }
        
        .progreso-input:focus {
            outline: none;
            border-color: var(--color4);
            box-shadow: 0 0 0 3px rgba(62, 92, 118, 0.1);
        }
        
        .progreso-buttons {
            display: flex;
            gap: 8px;
        }
        
        .btn-check {
            flex: 1;
            padding: 10px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-check:active {
            transform: scale(0.95);
        }
        
        .btn-reset {
            flex: 1;
            padding: 10px;
            background: white;
            color: var(--color3);
            border: 2px solid var(--color2);
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-reset:active {
            background: var(--color1);
        }
        
        .completado-badge {
            display: inline-block;
            background: var(--success);
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            margin-top: 6px;
        }
        
        /* ===== FOOTER ===== */
        .footer {
            margin-top: 32px;
            padding: 20px 16px;
            background: white;
            border-radius: 8px;
            border-top: 2px solid var(--color2);
            font-size: 13px;
            color: var(--color3);
        }
        
        .footer h3 {
            color: var(--color5);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        
        .footer-list {
            list-style: none;
        }
        
        .footer-list li {
            margin-bottom: 6px;
            padding-left: 16px;
            position: relative;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .footer-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--success);
            font-weight: bold;
        }
        
        .footer-list strong {
            color: var(--color5);
        }
        
        /* ===== NOTICE ===== */
        .notice {
            background: rgba(201, 220, 232, 0.3);
            border: 1px solid var(--color3);
            color: var(--color5);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 12px;
            line-height: 1.4;
        }
        
        /* ===== NO RESULTADOS ===== */
        .no-resultados {
            text-align: center;
            padding: 40px 20px;
        }
        
        .no-resultados-icon {
            font-size: 40px;
            opacity: 0.3;
            margin-bottom: 12px;
        }
        
        .no-resultados-text {
            color: var(--color3);
            font-size: 14px;
        }
        
        /* ===== FOOTER INFO ===== */
        .footer-info {
            text-align: center;
            margin-top: 16px;
            padding-top: 16px;
            font-size: 11px;
            color: var(--color3);
            border-top: 1px solid var(--color2);
        }
        
        /* ===== DARK MODE ===== */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: var(--color5);
            }
            
            .header {
                background: linear-gradient(135deg, #0f1822 0%, #0a0e16 100%);
            }
            
            .container > * {
                background: var(--color5);
            }
            
            .perfil-btn:not(.active),
            .dia-header,
            .ejercicio-card,
            .footer,
            .password-box {
                background: #2a3f5f;
                color: var(--color1);
            }
            
            .ejercicio-info h3,
            .footer h3,
            .password-box h2,
            .dia-header h2 {
                color: var(--color1);
            }
            
            .tab-btn {
                color: var(--color2);
            }
            
            .tab-btn.active {
                color: var(--color1);
            }
        }
    </style>
</head>
<body>
    <!-- Modal Contraseña -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2>🔐 Acceso Seguro</h2>
            <p>Ingresa tu contraseña</p>
            <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="off">
            <button onclick="verificarPassword()">Ingresar</button>
            <div class="password-error" id="passwordError">Contraseña incorrecta</div>
        </div>
    </div>
    
    <!-- Main App -->
    <div class="container" id="mainApp" style="display: none;">
        <div class="header">
            <h1 id="headerTitle">💪 Rutina de Cris</h1>
            <p id="headerSub"></p>
            <div class="header-badges" id="headerBadges"></div>
        </div>
        
        <div class="notice">
            ✅ <strong>Versión Optimizada para Móvil:</strong> Interfaz completamente responsive y soporta modo oscuro del dispositivo.
        </div>
        
        <div class="perfiles" id="perfilesContainer"></div>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar ejercicio...">
            </div>
            <button class="btn-help" onclick="mostrarAyuda()">❓ Ayuda</button>
        </div>
        
        <div class="tabs" id="tabsContainer"></div>
        
        <div id="contentContainer"></div>
        
        <div class="footer">
            <h3 id="footerTitle"></h3>
            <ul class="footer-list" id="footerList"></ul>
        </div>
        
        <div class="footer-info">
            <p>🏋️ Rutina Offline Responsive • Oct 2026 • Hecho con ❤️ para Cris y Fafis</p>
        </div>
    </div>
    
    <script>
        // Validación de contraseña
        function verificarPassword() {
            const input = document.getElementById('passwordInput');
            const clave = 'lituchis';
            
            if (input.value === clave) {
                document.getElementById('passwordModal').classList.add('hidden');
                document.getElementById('mainApp').style.display = 'block';
                inicializar();
            } else {
                const error = document.getElementById('passwordError');
                error.classList.add('show');
                input.value = '';
                input.focus();
                setTimeout(() => error.classList.remove('show'), 3000);
            }
        }
        
        // Detectar Enter en input de contraseña
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        verificarPassword();
                    }
                });
                passwordInput.focus();
            }
        });

        const RUTINAS = { cris: RUTINA_CRIS, fafis: RUTINA_FAFIS };

        const PERFILES = {
            cris: {
                nombre: 'Cris',
                subtitulo: 'Hipertrofia • Ectomorfo intermedio',
                badges: ['5 días/semana', 'Intermedio', 'Ganar masa'],
                consejosTitulo: '📋 Consejos para Ectomorfos',
                consejos: [
                    ['Nutrición', 'Come en superávit calórico (300-500 cal extra)'],
                    ['Proteína', '1.6-2.2g/kg de peso corporal'],
                    ['Descanso', 'Duerme 7-9 horas cada noche'],
                    ['Progresión', 'Aumenta peso cada 7-10 días'],
                    ['Técnica', 'Fase excéntrica de 3 segundos']
                ]
            },
            fafis: {
                nombre: 'Fafis',
                subtitulo: 'Principiante • Piernas y glúteos con tren superior equilibrado',
                badges: ['5 días/semana', 'Principiante', 'Glúteo y pierna'],
                consejosTitulo: '📋 Consejos para tu primer mes y más',
                consejos: [
                    ['Calentamiento', '5-10 min de cardio suave y 1 serie ligera del primer ejercicio'],
                    ['Peso', 'Elige uno con el que termines cada serie con 2-3 repeticiones en reserva'],
                    ['Técnica primero', 'El primer mes es para aprender el movimiento; sube el peso poco a poco'],
                    ['Progresión', 'Cuando completes todas las series en el rango alto de repeticiones con buena técnica, sube un poco el peso'],
                    ['Alimentación y sueño', 'Incluye proteína en cada comida y duerme 7-9 horas'],
                    ['Señales', 'Cansancio muscular es normal; dolor en articulaciones no. Si pasa, para y ajusta. Con alguna condición médica, consúltalo con tu médico']
                ]
            }
        };

        let perfil = localStorage.getItem('perfil') === 'fafis' ? 'fafis' : 'cris';
        let diaSeleccionado = "LUNES";
        let expandidos = {};
        let completados = JSON.parse(localStorage.getItem('completados')) || {};
        // Migración: el progreso guardado antes de existir los perfiles pertenece a Cris
        (function migrar() {
            let cambio = false;
            Object.keys(completados).forEach(k => {
                if (!/^(cris|fafis)-/.test(k)) {
                    completados['cris-' + k] = completados[k];
                    delete completados[k];
                    cambio = true;
                }
            });
            if (cambio) localStorage.setItem('completados', JSON.stringify(completados));
        })();
        
        function renderPerfiles() {
            document.getElementById('perfilesContainer').innerHTML = Object.keys(PERFILES).map(k =>
                `<button class="perfil-btn ${k === perfil ? 'active' : ''}" onclick="cambiarPerfil('${k}')">${PERFILES[k].nombre}</button>`
            ).join('');
        }

        function renderPerfilInfo() {
            const p = PERFILES[perfil];
            document.getElementById('headerTitle').textContent = `💪 Rutina de ${p.nombre}`;
            document.getElementById('headerSub').textContent = p.subtitulo;
            document.getElementById('headerBadges').innerHTML = p.badges.map(b => `<span class="header-badge">${b}</span>`).join('');
            document.getElementById('footerTitle').textContent = p.consejosTitulo;
            document.getElementById('footerList').innerHTML = p.consejos.map(c => `<li><strong>${c[0]}:</strong> ${c[1]}</li>`).join('');
        }

        function cambiarPerfil(nuevo) {
            if (!PERFILES[nuevo] || nuevo === perfil) return;
            perfil = nuevo;
            localStorage.setItem('perfil', perfil);
            diaSeleccionado = 'LUNES';
            document.getElementById('searchInput').value = '';
            renderPerfiles();
            renderPerfilInfo();
            renderTabs();
            renderContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function inicializar() {
            renderPerfiles();
            renderPerfilInfo();
            renderTabs();
            renderContent();
            document.getElementById('searchInput').addEventListener('input', buscar);
        }
        
        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = ['LUNES', 'MARTES', 'MIERCOLES', 'JUEVES', 'VIERNES'].map(dia => 
                `<button class="tab-btn ${dia === diaSeleccionado ? 'active' : ''}" onclick="cambiarDia('${dia}')">${dia}</button>`
            ).join('');
        }
        
        function cambiarDia(dia) {
            diaSeleccionado = dia;
            renderTabs();
            renderContent();
            document.getElementById('searchInput').value = '';
            document.getElementById('tabsContainer').scrollLeft = 0;
        }
        
        function renderContent() {
            const container = document.getElementById('contentContainer');
            const datosEjercicios = RUTINAS[perfil][diaSeleccionado].ejercicios;
            
            let html = `
                <div class="dia-header">
                    <h2>${diaSeleccionado} - ${RUTINAS[perfil][diaSeleccionado].titulo}</h2>
                    <p>⏱️ Duración: ${RUTINAS[perfil][diaSeleccionado].duracion}</p>
                </div>
            `;
            
            datosEjercicios.forEach((ej, idx) => {
                const id = `${perfil}-${diaSeleccionado}-${idx}`;
                const expanded = expandidos[id] ? 'expanded' : '';
                const isCompleted = completados[id];
                const toggleIcon = expandidos[id] ? '−' : '+';
                
                
                html += `
                    <div class="ejercicio-card ${expanded}" id="card-${id}">
                        <div class="ejercicio-header" onclick="toggleEjercicio('${id}')">
                            <div style="flex: 1;">
                                <div class="ejercicio-info">
                                    <h3>${ej.nombre}</h3>
                                    <div class="ejercicio-tags">
                                        <span class="tag tipo">${ej.musculo}</span>
                                        <span class="tag">${ej.tipo}</span>
                                    </div>
                                    ${isCompleted ? '<div class="completado-badge">✓ Hecho</div>' : ''}
                                </div>
                            </div>
                            <div class="ejercicio-toggle">${toggleIcon}</div>
                        </div>
                        <div class="ejercicio-content">
                            <div class="smartworkout-section">${mediaHTML(ej.nombre)}</div>
                            
                            <div class="ejercicio-detalles">
                                <div class="detalle">
                                    <div class="detalle-label">Series</div>
                                    <div class="detalle-valor">${ej.series}</div>
                                </div>
                                <div class="detalle">
                                    <div class="detalle-label">Reps</div>
                                    <div class="detalle-valor">${ej.reps}</div>
                                </div>
                                <div class="detalle">
                                    <div class="detalle-label">Descanso</div>
                                    <div class="detalle-valor">${ej.descanso || '60-120s'}</div>
                                </div>
                                <div class="detalle">
                                    <div class="detalle-label">Tipo</div>
                                    <div class="detalle-valor">${ej.tipo.substring(0, 10)}</div>
                                </div>
                            </div>
                            
                            <div class="progreso-section">
                                <div class="progreso-title">Mis notas</div>
                                <input type="text" id="notas-${id}" class="progreso-input" placeholder="Peso, series...">
                                <div class="progreso-buttons">
                                    <button class="btn-check" onclick="marcarCompleto('${id}')">✓ Hecho</button>
                                    <button class="btn-reset" onclick="limpiarProgreso('${id}')">Limpiar</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function toggleEjercicio(id) {
            expandidos[id] = !expandidos[id];
            const card = document.getElementById(`card-${id}`);
            if (card) card.classList.toggle('expanded');
        }
        
        function marcarCompleto(id) {
            const notas = document.getElementById(`notas-${id}`).value;
            completados[id] = { fecha: new Date().toLocaleString(), notas: notas };
            localStorage.setItem('completados', JSON.stringify(completados));
            renderContent();
        }
        
        function limpiarProgreso(id) {
            delete completados[id];
            localStorage.setItem('completados', JSON.stringify(completados));
            renderContent();
        }
        
        function buscar(e) {
            const query = e.target.value.toLowerCase();
            const container = document.getElementById('contentContainer');
            
            if (!query) {
                renderContent();
                return;
            }
            
            const resultados = RUTINAS[perfil][diaSeleccionado].ejercicios.filter(ej => 
                ej.nombre.toLowerCase().includes(query) || 
                ej.musculo.toLowerCase().includes(query)
            );
            
            if (resultados.length === 0) {
                container.innerHTML = `
                    <div class="no-resultados">
                        <div class="no-resultados-icon">🔍</div>
                        <div class="no-resultados-text">No encontramos ejercicios</div>
                    </div>
                `;
                return;
            }
            
            let html = '';
            resultados.forEach((ej) => {
                
                html += `
                    <div class="ejercicio-card">
                        <div class="ejercicio-header" onclick="this.parentElement.classList.toggle('expanded')">
                            <div style="flex: 1;">
                                <div class="ejercicio-info">
                                    <h3>${ej.nombre}</h3>
                                    <div class="ejercicio-tags"><span class="tag tipo">${ej.musculo}</span></div>
                                </div>
                            </div>
                            <div class="ejercicio-toggle">+</div>
                        </div>
                        <div class="ejercicio-content">
                            <div class="smartworkout-section">${mediaHTML(ej.nombre)}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function mostrarAyuda() {
            alert('💪 CÓMO USAR\\n\\n✓ Elige Cris o Fafis arriba\n✓ Tap en tabs para cambiar día\\n✓ Tap en ejercicio para expandir\\n✓ "Abrir" para ver en SmartWorkout\\n✓ Marca como hecho\\n✓ Datos se guardan automáticamente\\n\\n🎯 RESPONSIVE\\nSe adapta a cualquier dispositivo\\n\\n¡A entrenar! 💪');
        }
    </script>
